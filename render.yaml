# Render Blueprint for Animalia
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: animalia-db
    plan: basic-256mb
    databaseName: animalia
    user: animalia

services:
  - type: web
    name: animalia-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: animalia-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: animalia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_CREATE_ADMIN
        value: true

  - type: web
    name: animalia-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
